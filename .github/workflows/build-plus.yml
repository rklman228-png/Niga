name: Build Plus Bridge

on:
  push:
    branches: [main]
    paths:
      - scripts/plus-bootstrap.mjs
      - scripts/plus-fixups.mjs
      - .github/workflows/build-plus.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x64:
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Checkout bridge overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone upstream
        shell: pwsh
        run: git clone --depth 1 https://github.com/totec448-spec/chat-on-steroids.git source

      - name: Apply Plus Bridge
        shell: pwsh
        run: |
          Copy-Item overlay\scripts\plus-bootstrap.mjs source\scripts\plus-bootstrap.mjs -Force
          Copy-Item overlay\scripts\plus-fixups.mjs source\scripts\plus-fixups.mjs -Force
          Push-Location source
          node scripts/plus-bootstrap.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/plus-fixups.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Verify TypeScript and tests
        working-directory: source
        run: npm run verify:ci

      - name: Build x64 installer
        working-directory: source
        run: npm run dist:x64

      - name: Package extension and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item source\release\Chat-On-Steroids-Setup-x64.exe artifacts\Chat-On-Steroids-Plus-Setup-x64.exe
          Compress-Archive -Path source\extension\* -DestinationPath artifacts\Chat-On-Steroids-Plus-Extension.zip -CompressionLevel Optimal
          $files = Get-ChildItem artifacts -File
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          Set-Content artifacts\SHA256SUMS.txt -Value $lines -Encoding utf8NoBOM
          Get-Content artifacts\SHA256SUMS.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: chat-on-steroids-plus-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
