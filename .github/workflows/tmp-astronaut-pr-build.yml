name: Temporary Astronaut PR build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Prepare project
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/astronaut"
          base64 -d astronaut-project.b64 | tar -xzf - -C "$RUNNER_TEMP/astronaut"
      - name: Build bundled jar and verify
        shell: bash
        run: |
          cd "$RUNNER_TEMP/astronaut"
          cat >> build.gradle <<'EOF'

          repositories {
              maven { url = 'https://maven.fabricmc.net/' }
          }

          dependencies {
              include 'net.fabricmc.fabric-api:fabric-api:0.158.0+26.2'
          }
          EOF
          gradle clean build --stacktrace
          JAR=$(find build/libs -maxdepth 1 -name 'astronaut-0.1.1.jar' -print -quit)
          test -n "$JAR"
          unzip -t "$JAR"
          jar tf "$JAR" | grep -q 'dev/astronaut/gui/AstronautScreen.class'
          jar tf "$JAR" | grep -q 'dev/astronaut/config/AstronautConfig.class'
          jar tf "$JAR" | grep -q 'dev/astronaut/config/AstronautPreLaunch.class'
          jar tf "$JAR" | grep -q 'dev/astronaut/config/MinecraftOptionsBackup.class'
          jar tf "$JAR" | grep -Eq 'META-INF/jars/fabric-api-0\.158\.0\+26\.2.*\.jar'
          unzip -p "$JAR" fabric.mod.json | grep -q 'fabric-api'
          javap -verbose -classpath "$JAR" dev.astronaut.gui.AstronautScreen | grep 'major version: 69'
          cp "$JAR" build/libs/Astronaut-0.1.1+mc26.2-fixed.jar
      - name: Publish direct JAR release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='astronaut-0.1.1-mc26.2-fixed'
          JAR="$RUNNER_TEMP/astronaut/build/libs/Astronaut-0.1.1+mc26.2-fixed.jar"
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" "$JAR" --target main --title 'Astronaut 0.1.1 MC 26.2 fixed' --notes 'Fixed 26.2 GUI build with separate Astronaut/Minecraft settings persistence and Fabric API 0.158.0+26.2 bundled as a nested mod.' --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: Astronaut-0.1.1-mc26.2-fixed-bundled
          path: ${{ runner.temp }}/astronaut/build/libs/Astronaut-0.1.1+mc26.2-fixed.jar
          if-no-files-found: error
